server:
  port: 9001

app:
  storage:
    base-path: /stashbox
    users-dir: users
    temp-dir: temp
    items-dir: items
    cover-dir: cover
    notes-dir: notes
  images:
    max-size: ${IMAGE_OUTPUT_MAX_SIZE}
    output-quality: ${IMAGE_OUTPUT_QUALITY}
  attachments:
    max-file-size: 25MB
    max-files-per-note: 5
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - image/avif
      - image/bmp
      - image/tiff
      - application/pdf
      - text/plain
      - text/csv
      - application/json
      - application/zip
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/msword
      - application/vnd.ms-excel
      - application/vnd.ms-powerpoint
      - application/vnd.oasis.opendocument.text
      - application/vnd.oasis.opendocument.spreadsheet
  security:
    keycloak:
      server-url: ${KEYCLOAK_INTERNAL_URL}
      realm: ${KEYCLOAK_REALM}
      client-id: ${KEYCLOAK_CLIENT_ID}
      client-secret: ${KEYCLOAK_CLIENT_SECRET}
      webhook:
        hmac-secret: ${KEYCLOAK_WEBHOOK_HMAC_SECRET}
    cors:
      allowed-origins: ${FRONTEND_URL}
    public-endpoints: ${PUBLIC_ENDPOINTS}
    jwt:
      # Extra checks on top of signature/issuer/expiry. The realm is currently dedicated to
      # Stashbox, so tokens are pinned to the frontend client via azp. If the realm is ever
      # shared, keep this tight and consider adding a Keycloak audience mapper + accepted-audiences.
      accepted-authorized-parties: ${KEYCLOAK_ACCEPTED_AUTHORIZED_PARTIES:stashbox-frontend}
      accepted-audiences: ${KEYCLOAK_ACCEPTED_AUDIENCES:}
      require-bearer-token-type: true

spring:
  application:
    name: stashbox-api
  web:
    resources:
      add-mappings: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
        one-indexed-parameters: false
  datasource:
    url: ${STASHBOX_DB_URL}
    username: ${STASHBOX_DB_USER}
    password: ${STASHBOX_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 125MB
  cache:
    type: caffeine
    caffeine:
      spec: initialCapacity=10,maximumSize=10000,expireAfterAccess=7d
    cache-names: userIdByExternalId

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            # Server-to-server only (client_credentials grant) - no browser involved, so internal is correct.
            token-uri: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token

logging:
  level:
    root: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health