name: stashbox-dev
# =============================================================================
# Development stack for running stashbox-api from IntelliJ (and the frontend
# from `npm run dev`).
#
# This is the full stashbox docker-compose MINUS the `stashbox-api` and
# `stashbox-frontend` services - those run on the host instead:
#   - stashbox-api  -> IntelliJ, loading dev/.env as its env file
#   - frontend      -> `npm run dev`
#
# Differences from the production compose:
#   - stashbox-api / stashbox-frontend services removed
#   - postgres-stashbox and nginx publish ports so the host-run API/frontend
#     can reach them
#   - internal Keycloak URLs are hardcoded to http://keycloak:8080 (the app on
#     the host uses KEYCLOAK_INTERNAL_URL=http://localhost:9090 from dev/.env
#     instead, so the single .env can serve both compose and IntelliJ)
#   - the Keycloak webhook points at host.docker.internal:9001, where the
#     host-run API listens
# =============================================================================
services:
  # Keycloak database - stores Keycloak data, including app users
  postgres-keycloak:
    image: postgres:18.2
    restart: unless-stopped
    networks:
      - stashbox-network
    volumes:
      - ./volumes/keycloak-db:/var/lib/postgresql
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: "${KEYCLOAK_DB_USER}"
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak -U ${KEYCLOAK_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Keycloak server - manages the realm, authentication, and users
  keycloak:
    image: quay.io/phasetwo/phasetwo-keycloak:26.5.6
    restart: unless-stopped
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    command: start-dev --verbose
    ports:
      - "${KEYCLOAK_PORT}:8080"
    networks:
      - stashbox-network
    # Lets the Keycloak webhook reach the host-run stashbox-api.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KC_HEALTH_ENABLED: "true"
      # Master admin user
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_MASTER_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_MASTER_ADMIN_PASSWORD}
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: "${KEYCLOAK_DB_USER}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      # Host - full public-facing URL. For dev this is http://localhost:9090.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_SSL_REQUIRED: "none"
      # Other config
      KC_CACHE: local
      KC_FEATURES_DISABLED: "opentelemetry,opentelemetry-logs,opentelemetry-metrics,kerberos,par,dynamic-scopes,client-secret-rotation,declarative-ui,multi-site,recovery-codes,step-up-authentication,update-email,docker,device-flow,ciba,passkeys,passkeys-conditional-ui-authenticator,web-authn,oid4vc-vci,scripts,impersonation"
      JAVA_OPTS_APPEND: "-Xmx512m -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:G1PeriodicGCInterval=60000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=25"
    deploy:
      resources:
        limits:
          memory: 1200m
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # One-shot: applies the realm config via keycloak-config-cli, using $(env:VAR)
  keycloak-config:
    image: adorsys/keycloak-config-cli:latest-26
    restart: "no"
    networks:
      - stashbox-network
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./config/keycloak/stashbox-realm-template.json:/config/stashbox-realm-template.json:ro
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_MASTER_ADMIN_USER}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_MASTER_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_VAR_SUBSTITUTION_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: /config/stashbox-realm-template.json
      # Values consumed as $(env:VAR) placeholders inside the realm template:
      FRONTEND_URL: ${FRONTEND_URL}
      APP_ADMIN_USER: ${APP_ADMIN_USER}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
      KEYCLOAK_SSL_REQUIRED: ${KEYCLOAK_SSL_REQUIRED:-none}

  # One-shot: registers a Keycloak webhook via the Webhooks REST API to send events to the stashbox-api backend.
  keycloak-webhook-setup:
    image: curlimages/curl:latest
    restart: "no"
    networks:
      - stashbox-network
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
    entrypoint: ["sh", "/register-webhook.sh"]
    volumes:
      - ./config/keycloak/register-webhook.sh:/register-webhook.sh
    environment:
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: stashbox
      WEBHOOK_CLIENT_ID: stashbox-backend
      WEBHOOK_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
      # stashbox-api runs on the host (IntelliJ), reached from the Keycloak container.
      WEBHOOK_URL: http://host.docker.internal:9001/webhooks/keycloak
      WEBHOOK_HMAC_SECRET: ${KEYCLOAK_WEBHOOK_HMAC_SECRET}

  # Stashbox database - stores application user data
  postgres-stashbox:
    image: postgres:18.2
    restart: unless-stopped
    networks:
      - stashbox-network
    ports:
      - "${STASHBOX_DB_PORT}:5432"
    volumes:
      - ./volumes/stashbox-db:/var/lib/postgresql
    environment:
      POSTGRES_DB: stashbox
      POSTGRES_USER: "${STASHBOX_DB_USER}"
      POSTGRES_PASSWORD: "${STASHBOX_DB_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d stashbox -U ${STASHBOX_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nginx server - serves images and files from the OS.
  # Shares the storage dir with the host-run API: this ./volumes/stashbox-app
  # is the same directory the API writes to via APP_STORAGE_BASE_PATH in dev/.env.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - stashbox-network
    ports:
      - "${NGINX_PORT}:8080"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./volumes/stashbox-app:/storage:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  stashbox-network:
    driver: bridge
